# ---------- 危险意图（组合约束：动作倾向 + 严重伤害，避免误伤讨论案件） ----------
safety:
  violent_regex: '(我想|我要|我准备|我打算|计划|决定|马上|现在就|帮我|教我|告诉我怎么|如何|怎么).{0,18}(杀|砍|捅|打死|弄死|炸|放火|纵火|枪击|袭击|报复|投毒|绑架|制造爆炸|发动战争|实施犯罪|搞大事)|(杀|砍|捅|打死|弄死|炸|放火|纵火|枪击|袭击|报复|投毒|绑架|制造爆炸|发动战争|实施犯罪|搞大事).{0,18}(怎么办|怎么做|步骤|方法|计划|方案|工具|材料)'
  self_harm_regex: '(不想活|活不下去|结束生命|自杀|轻生|跳楼|割腕|服毒|寻死|去死).{0,20}(我|自己|本人|现在|马上|准备|打算|想|要|方法|怎么)'
safety_responses:
  violent_intent: "我不能帮助策划、实施或美化伤害他人、枪击、纵火、爆炸、恐怖袭击或其他犯罪行为。请立即停止当前行动，远离武器、易燃易爆物和可能受伤的人，不要单独处理。如果存在现实紧迫危险，请马上拨打 110；如有人受伤，请同时拨打 120。可以先联系一位可信任的家人、同事或社区负责人陪同，并只描述冲突事实，我可以继续帮你整理一份合法、安全的降温和求助步骤。"
  self_harm: "我很重视你现在的安全，但不能帮助提供自伤或结束生命的方法。请先远离可能伤害自己的物品和高处，尽快联系一位可信任的人陪在身边。如果你正准备行动或无法保证自己安全，请立即拨打 110 或 120，或直接前往最近的急诊。你也可以只告诉我：你现在是否安全、身边是否有人，我会继续陪你把下一步求助安排清楚。"

# ---------- 查询分解启发式 ----------
decompose:
  min_len: 36
  min_qwords: 2
  question_words:
    - "怎么办"
    - "怎么"
    - "如何"
    - "怎样"
    - "咋"
  conjunctions:
    - "还有"
    - "另外"
    - "以及"
    - "同时"
    - "除此之外"
    - "此外"
    - "并且"
    - "加"
    - "和"
  triggers:
    - "赔偿"
    - "怎么办"
    - "怎么"
    - "程序"
    - "处理"
    - "主张"
    - "如何"

