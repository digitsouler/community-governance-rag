# ---------- prompt 注入拦截（正则） ----------
injection_patterns:
  - '忽略(以上|前面|之前|上述|之前所有).{0,8}(指令|提示|规定|规则|系统|要求|设定)'
  - 'ignore\s+(the\s+)?(previous|above|prior|system|all)\s+(instructions|prompt|rules)'
  - 'disregard\s+.{0,30}instructions'
  - '(你|你现在|现在).{0,6}(是|变成|切换|进入).{0,10}(开发|调试|开发者|管理员|root|system|后台|danzel?)模式'
  - '(开发者|开发|调试|越狱|jailbreak|developer)\s*模式'
  - '(repeat|output|print|输出|复述|打印|透露)\s*(your|你(的)?)\s*(system\s+)?(prompt|提示词|系统提示|设定)'
  - 'system\s+prompt'
  - '把(你|系统)的(系统)?提示'
  - '作为(一个)?(开发|调试|测试)人员'

# ---------- 检索前停用词（reformulate 清洗） ----------
stopwords:
  - "我想问"
  - "请问"
  - "帮我"
  - "怎么"
  - "如何"
  - "怎么办"
  - "吗"
  - "呢"
  - "？"
  - "?"
  - "。"
  - "居民"
  - "社区"
  - "小区"

# ---------- AI 已问问题追踪（正则，防重复追问） ----------
asked_question_patterns:
  - '有没有.*记录|有没有.*录音|有没有.*录像|有没有.*截图|有没有.*证据|有没有.*照片'
  - '持续.*多久|多久了|几天.*了|什么时候开始的|几点.*开始|持续到'
  - '沟通过.*没|找过.*没|跟.*说过.*没|有没有.*沟通|有没有.*交涉|有没有.*协商'
  - '对方.*什么态度|他.*怎么回应|他.*怎么说|对方.*反应'
  - '物业.*没|社区.*没|居委会.*没|报警.*没|派出所.*没|12345.*没|街道.*没|管家.*没'
  - '影响.*怎样|影响.*如何|睡得好不好|休息.*影响|学习.*影响|工作.*影响'

