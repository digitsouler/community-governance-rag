# ---------- 事实抽取：时间范围补捞正则 ----------
fact_time_patterns:
  - '从.{0,6}点.{0,10}(到|搞到|持续到|一直).{0,6}(点|凌晨|半夜|深夜|早上|上午|下午|傍晚|夜里|通宵)'
  - '.{0,4}点.{0,6}(开始|就开始).{0,15}(搞到|到|持续到).{0,6}(点|凌晨|半夜|深夜)'
  - '(早上|中午|下午|晚上|傍晚|凌晨|半夜|深夜).{0,8}(开始|就).{0,15}(搞|弄|吵|响).{0,10}(到|持续|一直到).{0,8}(点|凌晨|半夜|深夜|早上)'
  - '每天?从.{0,6}(点|左右).{0,15}(到|搞到|持续到).{0,6}(点|凌晨|半夜)'
  - '\d{1,2}[点:时]\D{0,10}(到|—|~|至|搞到|持续到)\D{0,10}\d{1,2}[点:时]'
  - '(整晚|通宵|彻夜|一整夜|全天|从早到晚)'

