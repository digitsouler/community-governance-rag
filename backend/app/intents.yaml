# ----------------------------------------------------------------------------
# 所有中文关键词 / 正则都集中在此文件，改词只动这里，不用翻代码。
# 匹配逻辑在 backend/app/intent.py（IntentLayer），本文件只放“数据”。
#
# 约定：
#   - 普通关键词用双引号字符串列表，匹配方式为“子串包含”（kw in text）
#   - 正则用单引号字符串（保留反斜杠），IntentLayer 加载时预编译
#   - governance_domain / off_domain 在匹配前会把用户输入统一 lower()，故
#     英文词请写小写（如 ktv / k歌）
# ============================================================================

